<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가사 영상 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f4f0; --card:#ffffff; --ink:#15151b; --muted:#6c6b76; --line:#e2e0da;
  --accent:#5a48ff; --accent-ink:#ffffff; --soft:#efedff; --warn:#b4540a; --ok:#14804a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d11; --card:#17171d; --ink:#f2f1f6; --muted:#9b9aa8; --line:#2b2b34;
    --accent:#8a7cff; --accent-ink:#0d0d11; --soft:#23203d; --warn:#f0a35e; --ok:#58d391;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d11; --card:#17171d; --ink:#f2f1f6; --muted:#9b9aa8; --line:#2b2b34;
  --accent:#8a7cff; --accent-ink:#0d0d11; --soft:#23203d; --warn:#f0a35e; --ok:#58d391;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px;font-weight:900;letter-spacing:-.02em}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 0 14px;font-weight:800}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:110px;padding:14px 10px;text-align:center;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;
  background:var(--bg);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop.ok{border-style:solid;border-color:var(--ok)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop .ic{font-size:26px;line-height:1}
.drop b{font-size:14px}
.drop small{color:var(--muted);font-size:12px;word-break:break-all;max-width:100%}
.status{margin:12px 0 0;font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)} .status.good{color:var(--ok)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.style{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.style.on{border-color:var(--accent);background:var(--soft)}
.style input{position:absolute;opacity:0;pointer-events:none}
.style b{font-size:12.5px;line-height:1.25}
.style small{font-size:11px;color:var(--muted);line-height:1.3}
.thumb{height:46px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:15px;overflow:hidden}
.t-motion{background:radial-gradient(circle at 30% 40%,#e0489c,transparent 60%),radial-gradient(circle at 75% 60%,#4a5cf0,transparent 60%),#0a0816;color:#fff;text-shadow:0 0 10px #ff7bd0}
.t-min{background:#050505;color:#f4f4f4;font-size:19px;letter-spacing:-.03em}
.t-cut{background:#f4f4f4;color:#050505;font-size:19px;letter-spacing:-.03em}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.field{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:700}
input[type=text],select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px;min-height:32px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details{font-size:13px;color:var(--muted);margin-top:4px}
details summary{cursor:pointer;min-height:28px}
details ul{margin:6px 0 0;padding-left:18px;color:var(--ink)}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:88px;text-align:right}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:46px;padding:10px 18px;font-weight:800;font-size:15px}
.btn{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.block{width:100%}
button:disabled{opacity:.4;cursor:not-allowed}
.play{min-width:46px;padding:10px 14px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.result{margin-top:14px}
.result video{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9}
.result .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.result .btns button{flex:1 1 140px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>가사 영상 메이커</h1>
  <p class="sub">음악 파일과 .lrc 가사 파일만 올리면 가사 영상을 만들어 줘요. 모든 처리는 이 기기 안에서 이루어지고 파일은 어디로도 전송되지 않아요.</p>

  <section class="card">
    <h2><span class="n">1</span>파일 올리기</h2>
    <div class="drops">
      <label class="drop" id="dropAudio">
        <input type="file" id="fileAudio" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg">
        <span class="ic">♪</span><b>음악 파일</b><small id="audioInfo">mp3 · wav · m4a</small>
      </label>
      <label class="drop" id="dropLrc">
        <input type="file" id="fileLrc">
        <span class="ic">≡</span><b>가사 파일</b><small id="lrcInfo">.lrc</small>
      </label>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section class="card">
    <h2><span class="n">2</span>스타일과 설정</h2>
    <div class="styles" id="styles">
      <label class="style on" data-style="motion"><input type="radio" name="style" value="motion" checked>
        <div class="thumb t-motion">Aa</div><b>모션 그래픽</b><small>소리에 반응하는 배경과 반사 효과</small></label>
      <label class="style" data-style="minimal"><input type="radio" name="style" value="minimal">
        <div class="thumb t-min">AA</div><b>흑백 미니멀</b><small>화면을 가득 채우는 큰 글자</small></label>
      <label class="style" data-style="cut"><input type="radio" name="style" value="cut">
        <div class="thumb t-cut">WORD</div><b>단어 컷 전환</b><small>단어가 하나씩 크게 튀어나옴</small></label>
    </div>

    <label class="check"><input type="checkbox" id="censorOn" checked> 비속어를 *로 검열하기</label>
    <div class="row">
      <div class="field">
        <label for="extraWords">검열할 단어 추가 (쉼표로 구분)</label>
        <input type="text" id="extraWords" placeholder="예: damn, 단어2" autocomplete="off">
      </div>
    </div>
    <details id="censorDetails" hidden><summary id="censorSummary">검열된 줄 보기</summary><ul id="censorList"></ul></details>

    <div class="row" style="margin-top:12px">
      <div class="field"><label for="titleIn">제목 표시</label><input type="text" id="titleIn" autocomplete="off"></div>
      <div class="field"><label for="artistIn">아티스트 표시</label><input type="text" id="artistIn" autocomplete="off"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="resSel">해상도</label>
        <select id="resSel"><option value="720" selected>720p (빠르고 안정적)</option><option value="1080">1080p (선명, 느릴 수 있음)</option></select>
      </div>
      <div class="field">
        <label for="syncRange">가사 싱크 보정: <span id="syncVal">0.0초</span></label>
        <input type="range" id="syncRange" min="-3" max="3" step="0.1" value="0">
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span class="n">3</span>미리보기</h2>
    <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="ctrl">
      <button class="btn play" id="playBtn" disabled aria-label="재생">▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <span class="time" id="timeLbl">0:00 / 0:00</span>
    </div>
  </section>

  <section class="card">
    <h2><span class="n">4</span>영상 만들기</h2>
    <button class="btn block" id="exportBtn" disabled>영상 만들기</button>
    <div id="prog" hidden>
      <div class="bar"><i id="progBar"></i></div>
      <div class="status" id="progTxt"></div>
      <button class="btn sec block" id="cancelBtn" style="margin-top:8px">취소</button>
    </div>
    <p class="note" id="exportNote">곡이 재생되는 시간만큼(실시간으로) 녹화해요. 만드는 동안에는 이 화면을 켜 두고 다른 앱으로 나가지 마세요.</p>
    <div class="result" id="result" hidden>
      <video id="resultVideo" controls playsinline></video>
      <div class="btns">
        <button class="btn" id="saveBtn">저장하기</button>
        <button class="btn sec" id="againBtn">다시 만들기</button>
      </div>
      <p class="note" id="resultNote"></p>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';

/* ==PURE-START== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DW = 1280, DH = 720;

function parseLrc(text) {
  const entries = [], meta = {};
  let offset = 0;
  const tsRe = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
  for (const raw of String(text).replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const mt = line.match(/^\[([A-Za-z][A-Za-z #]*):\s*(.*)\]$/);
    if (mt) {
      const key = mt[1].trim().toLowerCase();
      if (key === 'offset') offset = parseInt(mt[2], 10) || 0;
      else meta[key] = mt[2].trim();
      continue;
    }
    const stamps = [...line.matchAll(tsRe)];
    if (!stamps.length) continue;
    const body = line.replace(tsRe, '').replace(/<\d+:\d+(?:[.:]\d+)?>/g, '').replace(/\s+/g, ' ').trim();
    for (const m of stamps) {
      const frac = m[3] ? parseFloat('0.' + m[3]) : 0;
      entries.push({ t: parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + frac - offset / 1000, text: body });
    }
  }
  entries.sort((a, b) => a.t - b.t);
  return { entries, meta };
}

function cleanMeta(meta) {
  let ti = meta.ti || meta.title || '';
  const ar = meta.ar || meta.artist || '';
  const al = meta.al || meta.album || '';
  ti = ti.replace(/^\d+\.\s*/, '');
  if (ar && ti.toLowerCase().startsWith(ar.toLowerCase() + ' - ')) ti = ti.slice(ar.length + 3);
  return { ti: ti.trim(), ar: ar.trim(), al: al.trim() };
}

const EN_BAD = ['motherfuck\\w*', 'fuck\\w*', 'bullshit\\w*', 'shit\\w*', 'bitch\\w*', 'asshole\\w*', 'ass', 'dick\\w*',
  'pussy', 'pussies', 'cunt\\w*', 'bastard\\w*', 'nigg\\w*', 'whore\\w*', 'slut\\w*', 'hos', 'hoes'];
const KO_BAD = ['개새끼', '미친놈', '미친년', '씨발', '시발', '씨팔', '병신', '지랄', '새끼', '존나', '좆', '씹', '썅', 'ㅅㅂ', 'ㅆㅂ', 'ㅂㅅ', 'ㅈㄹ'];
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function makeCensor(extra) {
  const en = EN_BAD.slice(), ko = KO_BAD.slice();
  String(extra || '').split(/[,\n]/).map(s => s.trim()).filter(Boolean).forEach(w => {
    if (/[\u3131-\uD79D]/.test(w)) ko.unshift(escRe(w)); else en.unshift(escRe(w));
  });
  const reEn = new RegExp('\\b(' + en.join('|') + ')\\b', 'gi');
  const reKo = new RegExp('(' + ko.join('|') + ')', 'g');
  return function (s) {
    let n = 0;
    s = s.replace(reEn, w => {
      n++;
      const a = Array.from(w);
      return a.length > 2 ? a[0] + '*'.repeat(a.length - 2) + a[a.length - 1] : '*'.repeat(a.length);
    });
    s = s.replace(reKo, w => {
      n++;
      const a = Array.from(w);
      return a[0] + '*'.repeat(a.length - 1);
    });
    return { text: s, count: n };
  };
}

// entries -> display lines (ts, te, text). Empty entries only end the previous line.
function buildLines(entries, syncOffset, dur) {
  const es = entries.map(e => ({ t: e.t + syncOffset, text: e.text })).filter(e => e.t > -0.5)
    .map(e => ({ t: Math.max(0, e.t), text: e.text }));
  es.sort((a, b) => a.t - b.t);
  const merged = [];
  for (const e of es) {
    const last = merged[merged.length - 1];
    if (last && Math.abs(last.t - e.t) < 0.02) {
      if (e.text) last.text = last.text ? last.text + ' ' + e.text : e.text;
    } else merged.push({ t: e.t, text: e.text });
  }
  const out = [];
  merged.forEach((e, i) => {
    if (!e.text) return;
    let te = i + 1 < merged.length ? merged[i + 1].t : (dur > e.t ? dur : e.t + 4);
    if (dur && te > dur) te = dur;
    if (te - e.t < 0.2) te = e.t + 0.2;
    out.push({ ts: e.t, te, orig: e.text });
  });
  return out;
}

function wordTimes(words, ts, te) {
  const chars = words.reduce((a, w) => a + Array.from(w).length, 0);
  const total = Math.min((te - ts) * 0.8, 0.09 * chars + 0.2);
  const wts = words.map(w => Array.from(w).length + 1);
  const sum = wts.reduce((a, b) => a + b, 0);
  const out = []; let acc = 0;
  for (const w of wts) { out.push(ts + total * acc / sum); acc += w; }
  return out;
}

function wrapBalanced(words, maxw, measure) {
  const space = measure(' ');
  const greedy = mw => {
    const rows = [[]]; let cur = 0;
    for (const w of words) {
      const wl = measure(w);
      if (rows[rows.length - 1].length && cur + space + wl > mw) { rows.push([]); cur = 0; }
      if (rows[rows.length - 1].length) cur += space;
      rows[rows.length - 1].push(w); cur += wl;
    }
    return rows;
  };
  const n = greedy(maxw).length;
  let lo = Math.max(...words.map(measure)), hi = maxw;
  if (lo > hi) return greedy(maxw);
  for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2; if (greedy(mid).length <= n) hi = mid; else lo = mid; }
  return greedy(hi);
}

function rowsFor(words) {
  const chars = words.reduce((a, w) => a + Array.from(w).length, 0);
  const n = Math.min(words.length, Math.max(1, Math.min(4, Math.ceil(chars / 13))));
  const target = chars / n;
  const rows = [[]]; let c = 0;
  for (const w of words) {
    const len = Array.from(w).length;
    if (rows[rows.length - 1].length && rows.length < n && c + len / 2 > target) { rows.push([]); c = 0; }
    rows[rows.length - 1].push(w); c += len;
  }
  return rows;
}

function lineIndexAt(lines, t) {
  let lo = 0, hi = lines.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (lines[mid].ts <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}

function fmt(t) { t = Math.max(0, t || 0); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); }
/* ==PURE-END== */

/* ------------------------------------------------------------------ DOM */
const $ = id => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d');
const mc = document.createElement('canvas').getContext('2d');
const FONT_STACK = '"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const font = (w, s) => `${w} ${s}px ${FONT_STACK}`;

/* ------------------------------------------------------------------ state */
let rawEntries = [], meta = {}, lines = [], dur = 0, posterT = 0;
let style = 'motion', res = 720, syncOffset = 0, censorOn = true;
let censoredInfo = [];
let buffer = null;
let ac = null, bus, analyser, speakerGain, recDest, fd, bandRanges = [];
let srcNode = null, playing = false, startCtxTime = 0, startOffset = 0;
let exporting = false, rec = null, chunks = [], recMime = '', exportPausedHidden = false, wakeLock = null;
let resultBlob = null, resultUrl = '', resultExt = 'webm';
let dlNS = null;
const layoutCache = new Map();
let bars = new Float32Array(48), bassEnv = 0, seeking = false;

try { if (window.claude && window.claude.use) window.claude.use('downloads').then(ns => { dlNS = ns || null; }).catch(() => {}); } catch (e) {}

/* ------------------------------------------------------------------ audio graph */
function ensureAC() {
  if (ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  bus = ac.createGain();
  analyser = ac.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.6;
  analyser.minDecibels = -85; analyser.maxDecibels = -25;
  speakerGain = ac.createGain();
  bus.connect(analyser); bus.connect(speakerGain); speakerGain.connect(ac.destination);
  if (ac.createMediaStreamDestination) { recDest = ac.createMediaStreamDestination(); bus.connect(recDest); }
  fd = new Uint8Array(analyser.frequencyBinCount);
  const binHz = ac.sampleRate / analyser.fftSize;
  bandRanges = [];
  for (let i = 0; i < 48; i++) {
    const e0 = 50 * Math.pow(9000 / 50, i / 48), e1 = 50 * Math.pow(9000 / 50, (i + 1) / 48);
    const lo = Math.floor(e0 / binHz), hi = Math.max(lo + 1, Math.ceil(e1 / binHz));
    bandRanges.push([lo, hi]);
  }
}

function curTime() { return playing ? Math.min(dur, startOffset + (ac.currentTime - startCtxTime)) : startOffset; }

function stopSrc() {
  if (!srcNode) return;
  srcNode.onended = null;
  try { srcNode.stop(); } catch (e) {}
  try { srcNode.disconnect(); } catch (e) {}
  srcNode = null;
}

function play(from) {
  stopSrc();
  const node = ac.createBufferSource();
  node.buffer = buffer;
  node.connect(bus);
  node.onended = () => { if (node === srcNode) handleEnded(); };
  node.start(0, clamp(from, 0, Math.max(0, dur - 0.01)));
  srcNode = node; startCtxTime = ac.currentTime; startOffset = from; playing = true;
  updatePlayBtn();
}

function pause() {
  if (!playing) return;
  startOffset = curTime();
  stopSrc(); playing = false;
  updatePlayBtn();
}

function handleEnded() {
  playing = false; startOffset = dur; srcNode = null;
  updatePlayBtn();
  if (exporting) setTimeout(finishExport, 450);
}

/* ------------------------------------------------------------------ lyric build + censor */
function rebuildLines() {
  const base = buildLines(rawEntries, syncOffset, dur);
  const censor = makeCensor($('extraWords').value);
  censoredInfo = [];
  lines = base.map(l => {
    let text = l.orig;
    if (censorOn) {
      const r = censor(l.orig);
      text = r.text;
      if (r.count) censoredInfo.push(text);
    }
    return { ts: l.ts, te: l.te, text, words: text.split(/\s+/).filter(Boolean) };
  }).filter(l => l.words.length);
  layoutCache.clear();
  const det = $('censorDetails');
  if (censorOn && censoredInfo.length) {
    det.hidden = false;
    $('censorSummary').textContent = `검열된 줄 ${censoredInfo.length}개 보기`;
    const ul = $('censorList'); ul.innerHTML = '';
    censoredInfo.forEach(s => { const li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
  } else det.hidden = true;
  const all = lines.map(l => l.text).join(' ');
  if (/[\u3131-\uD79D]/.test(all) && document.fonts && document.fonts.load) {
    [700, 800, 900].forEach(w => document.fonts.load(`${w} 40px "Noto Sans KR"`, all).then(() => layoutCache.clear()).catch(() => {}));
  }
  refresh();
}

function ready() { return !!(buffer && lines.length); }

function setStatus(msg, kind) { const s = $('status'); s.textContent = msg || ''; s.className = 'status' + (kind ? ' ' + kind : ''); }

function refresh() {
  const ok = ready();
  $('playBtn').disabled = !ok; $('seek').disabled = !ok;
  $('exportBtn').disabled = !ok || exporting;
  if (buffer && !lines.length && rawEntries.length === 0 && $('lrcInfo').dataset.loaded) setStatus('가사 파일에서 시간이 표시된 가사를 찾지 못했어요.', 'err');
  else if (ok) setStatus(`준비됐어요 · 가사 ${lines.length}줄 · 길이 ${fmt(dur)}` + (censorOn && censoredInfo.length ? ` · 검열 ${censoredInfo.length}줄` : ''), 'good');
  else if (!buffer && !rawEntries.length) setStatus('음악 파일과 가사 파일을 모두 올려 주세요.');
  else if (!buffer) setStatus('음악 파일을 올려 주세요.');
  else setStatus('가사 파일을 올려 주세요.');
}

/* ------------------------------------------------------------------ file loading */
async function loadAudioFile(f) {
  setStatus('음악을 분석하는 중이에요…');
  try {
    ensureAC();
    const ab = await f.arrayBuffer();
    buffer = await new Promise((res_, rej) => { const p = ac.decodeAudioData(ab, res_, rej); if (p && p.catch) p.catch(rej); });
    dur = buffer.duration;
    $('audioInfo').textContent = f.name; $('dropAudio').classList.add('ok');
    if (playing) pause();
    startOffset = 0;
    if (rawEntries.length) rebuildLines(); else refresh();
    setPoster();
  } catch (e) {
    buffer = null; dur = 0; $('dropAudio').classList.remove('ok');
    setStatus('이 음악 파일을 읽을 수 없어요. mp3, wav, m4a 파일인지 확인해 주세요.', 'err');
  }
}

async function loadLrcFile(f) {
  try {
    const text = await f.text();
    const p = parseLrc(text);
    rawEntries = p.entries; meta = cleanMeta(p.meta);
    $('lrcInfo').textContent = f.name; $('lrcInfo').dataset.loaded = '1'; $('dropLrc').classList.add('ok');
    if (meta.ti) $('titleIn').value = meta.ti;
    if (meta.ar) $('artistIn').value = meta.ar;
    rebuildLines(); setPoster();
  } catch (e) { setStatus('가사 파일을 읽을 수 없어요.', 'err'); }
}

function setPoster() {
  if (!lines.length || exporting) return;
  if (!playing) { posterT = Math.min(Math.max(0, dur - 0.1), lines[0].ts + Math.min(2, (lines[0].te - lines[0].ts) * 0.9)); startOffset = posterT; }
}

$('fileAudio').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadAudioFile(f); });
$('fileLrc').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadLrcFile(f); });
['dropAudio', 'dropLrc'].forEach(id => {
  const el = $(id);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  ['dropAudio', 'dropLrc'].forEach(id => $(id).classList.remove('over'));
  for (const f of (e.dataTransfer && e.dataTransfer.files) || []) {
    if (/\.(lrc|txt)$/i.test(f.name)) loadLrcFile(f); else loadAudioFile(f);
  }
});

/* ------------------------------------------------------------------ settings */
document.querySelectorAll('#styles .style').forEach(l => {

$('censorOn').addEventListener('change', e => { censorOn = e.target.checked; if (rawEntries.length) rebuildLines(); });
$('extraWords').addEventListener('change', () => { if (rawEntries.length) rebuildLines(); });
$('syncRange').addEventListener('input', e => {

/* ------------------------------------------------------------------ transport UI */
function updatePlayBtn() { $('playBtn').textContent = playing ? '❚❚' : '▶'; $('playBtn').setAttribute('aria-label', playing ? '일시정지' : '재생'); }
$('playBtn').addEventListener('click', async () => {
  if (!ready() || exporting) return;
  ensureAC(); try { await ac.resume(); } catch (e) {}

/* ------------------------------------------------------------------ layout (cached) */
function getLayout(kind, i) {
  const key = kind + '|' + i;
  let l = layoutCache.get(key);
  if (!l) { l = kind === 'motion' ? layoutMotion(i) : kind === 'minimal' ? layoutMinimal(i) : layoutCut(i); layoutCache.set(key, l); }
  return l;
}

function layoutMotion(i) {
  const L = lines[i];
  let size = 68; const maxw = 1040;
  mc.font = font(800, size);
  const maxWord = Math.max(...L.words.map(w => mc.measureText(w).width));
  if (maxWord > maxw) size *= maxw / maxWord;
  mc.font = font(800, size);
  const measure = s => mc.measureText(s).width;
  const rows = wrapBalanced(L.words, maxw, measure);
  let lineh = size * 1.24;
  if (rows.length * lineh > 430) { const k = 430 / (rows.length * lineh); size *= k; lineh *= k; mc.font = font(800, size); }
  const top = 322 - rows.length * lineh / 2;
  const space = measure(' ');
  const words = []; let wi = 0;
  rows.forEach((row, r) => {
    const rw = row.reduce((a, w) => a + measure(w), 0) + space * (row.length - 1);
    let x = (DW - rw) / 2;
    const base = top + r * lineh + lineh / 2 + 0.36 * size;
    row.forEach(w => { words.push({ text: w, x, base, i: wi++ }); x += measure(w) + space; });
  });
  return { size, words, bottom: top + rows.length * lineh };
}

function layoutMinimal(i) {
  const L = lines[i];
  const words = L.words.map(w => w.toUpperCase());
  const rows = rowsFor(words);
  const TW = 1160, CAP = 330, MAXH = 590, M = 60, CH = 0.73;
  mc.font = font(900, 200);
  const info = rows.map(r => ({ r, size: Math.min(CAP, 200 * TW / Math.max(1, mc.measureText(r.join(' ')).width)) }));
  const total = () => info.reduce((a, x) => a + CH * x.size, 0) + info.slice(0, -1).reduce((a, x) => a + 0.2 * x.size, 0);
  let tot = total();
  if (tot > MAXH) { info.forEach(x => { x.size *= MAXH / tot; }); tot = total(); }
  let y = (DH - tot) / 2;
  const out = [];
  info.forEach((x, ri) => {
    mc.font = font(900, x.size);
    const sp = mc.measureText(' ').width;
    const rw = mc.measureText(x.r.join(' ')).width;
    const capH = CH * x.size;
    let px = info.length === 1 ? (DW - rw) / 2 : (ri % 2 === 0 ? M : DW - M - rw);
    const base = y + capH;
    x.r.forEach(w => { const ww = mc.measureText(w).width; out.push({ text: w, x: px, base, w: ww, size: x.size }); px += ww + sp; });
    y += capH + 0.2 * x.size;
  });
  return { words: out, times: wordTimes(words, L.ts, L.te) };
}

function layoutCut(i) {
  const L = lines[i];
  const words = L.words.map(w => w.toUpperCase());
  mc.font = font(900, 200);
  const ws = words.map(w => ({ text: w, size: Math.min(430, 200 * 1100 / Math.max(1, mc.measureText(w).width)) }));
  let csz = 24;
  mc.font = font(700, csz);
  let tw = words.reduce((a, w) => a + mc.measureText(w).width, 0) + mc.measureText(' ').width * (words.length - 1);
  if (tw > 1160) { csz = 24 * 1160 / tw; mc.font = font(700, csz); tw = 1160; }
  const sp = mc.measureText(' ').width;
  let x = (DW - tw) / 2;
  const ctx = words.map(w => { const o = { text: w, x }; x += mc.measureText(w).width + sp; return o; });
  return { words: ws, ctx, csz, times: wordTimes(words, L.ts, L.te) };
}

/* ------------------------------------------------------------------ audio analysis per frame */
function updateAudio(dt) {
  const k = Math.pow(0.82, dt * 30), kb = Math.pow(0.86, dt * 30);
  if (analyser && playing) {
    analyser.getByteFrequencyData(fd);
    for (let b = 0; b < 48; b++) {
      const [lo, hi] = bandRanges[b]; let s = 0, n = 0;
      for (let j = lo; j < hi && j < fd.length; j++) { s += fd[j]; n++; }
      const v = clamp(((n ? s / n : 0) / 255 - 0.22) / 0.62, 0, 1.15);
      bars[b] = Math.max(v, bars[b] * k);
    }
  } else { for (let b = 0; b < 48; b++) bars[b] *= k; }
  let bs = 0; for (let b = 0; b < 8; b++) bs += bars[b];
  bassEnv = Math.max(bs / 8, bassEnv * kb);
}

/* ------------------------------------------------------------------ drawing: shared */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry(7);
const rr = (a, b) => a + (b - a) * rng();
const ACCENTS = [[120, 165, 255], [255, 115, 190], [110, 230, 255]];
const COLS_A = [[70, 50, 230], [40, 150, 220], [120, 50, 200], [30, 90, 200]];
const COLS_B = [[220, 40, 120], [150, 30, 200], [230, 80, 70], [90, 40, 200]];
const BLOBS = [[0.5, 0.3, 0, 0, 0.21, 0.17, 0.0, 0.30], [1.3, 0.7, 0, 0, 0.16, 0.23, 1.7, 0.28], [0.9, 0.5, 0, 0, 0.13, 0.19, 3.1, 0.34], [0.3, 0.8, 0, 0, 0.25, 0.14, 4.4, 0.26]];
const GAUSS = [[0, 1], [0.2, 0.835], [0.4, 0.487], [0.6, 0.198], [0.8, 0.056], [1, 0]];
const SHARDS = Array.from({ length: 7 }, () => {
  const n = rng() < 0.5 ? 3 : 4;
  return { cx: rr(0.08, 0.92) * DW, cy: rr(0.1, 0.9) * DH, ph: rr(0, 6), n,
    angs: Array.from({ length: n }, (_, k) => 2 * Math.PI * k / n + rr(-0.5, 0.5)),
    rads: Array.from({ length: n }, () => rr(0.5, 1) * rr(110, 250)), spd: rr(-0.14, 0.14) };
});
const DUST = Array.from({ length: 70 }, () => ({ x: rr(0, DW), y: rr(0, DH), sp: rr(8, 38), sz: rr(1.2, 3.4), ph: rr(0, 6.28) }));
const BAR_COLS = Array.from({ length: 96 }, (_, i) => { const f = Math.abs(i - 47.5) / 48; return [Math.round(90 + 165 * f), Math.round(200 - 100 * f), Math.round(255 - 65 * f)]; });

// film grain pattern
const grain = (() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'); const id = gc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gc.putImageData(id, 0, 0); return g;
})();
let grainPat = null;

function drawUI(c, t, k, dim, strong, big) {
  c.save();
  c.textBaseline = 'alphabetic';
  const title = $('titleIn').value.trim(), artist = $('artistIn').value.trim();
  if (big) {
    c.fillStyle = strong; c.textAlign = 'left'; c.font = font(900, 26); c.fillText(title, 48, 62);
    c.fillStyle = dim; c.font = font(700, 16); c.fillText(artist, 48, 88);
  } else {
    c.fillStyle = dim; c.font = font(700, 14);
    c.textAlign = 'left'; c.fillText(title.toUpperCase(), 60, 36);
    c.textAlign = 'right'; c.fillText(artist.toUpperCase(), DW - 60, 36);
    c.textAlign = 'left'; c.fillText(`${String(k + 1).padStart(2, '0')} / ${String(lines.length).padStart(2, '0')}`, 60, 702);
    c.textAlign = 'right'; c.fillText(fmt(t), DW - 60, 702);
  }
  c.restore();
}

/* ------------------------------------------------------------------ style: motion */
function drawMotion(c, t, k) {
  const bass = bassEnv;
  c.fillStyle = '#06050f'; c.fillRect(0, 0, DW, DH);
  const w = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 38), inten = 0.5 + 0.55 * bass;
  c.globalCompositeOperation = 'lighter';
  BLOBS.forEach((b, i) => {
    const x = (b[0] + 0.35 * Math.sin(b[4] * t + b[6])) / (16 / 9) * DW, y = (b[1] + 0.3 * Math.sin(b[5] * t + b[6] * 1.3)) * DH;
    const R = b[7] * DH * 3;
    const col = COLS_A[i].map((v, j) => Math.round(v * (1 - w) + COLS_B[i][j] * w));
    const g = c.createRadialGradient(x, y, 0, x, y, R);
    GAUSS.forEach(([f, a]) => g.addColorStop(f, `rgba(${col[0]},${col[1]},${col[2]},${Math.min(1, a * inten)})`));
    c.fillStyle = g; c.fillRect(x - R, y - R, 2 * R, 2 * R);
  });
  c.globalCompositeOperation = 'source-over';
  const vg = c.createRadialGradient(DW / 2, DH / 2, DH * 0.35, DW / 2, DH / 2, DW * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.62)');
  c.fillStyle = vg; c.fillRect(0, 0, DW, DH);

  // shards
  SHARDS.forEach(s => {
    const x0 = s.cx + 40 * Math.sin(0.2 * t + s.ph), y0 = s.cy + 25 * Math.sin(0.17 * t + s.ph * 1.4);
    c.beginPath();
    s.angs.forEach((a, i) => { const px = x0 + s.rads[i] * Math.cos(a + s.spd * t), py = y0 + s.rads[i] * Math.sin(a + s.spd * t); i ? c.lineTo(px, py) : c.moveTo(px, py); });
    c.closePath();
    c.fillStyle = `rgba(235,240,255,${(9 + bass * 22) / 255})`; c.fill();
    c.strokeStyle = `rgba(200,220,255,${(38 + bass * 70) / 255})`; c.lineWidth = 1; c.stroke();
  });

  // ripples
  const acc = ACCENTS[t < 30 ? 0 : t < 60 ? 1 : 2];
  for (let i = 0; i < 3; i++) {
    const ph = (t * 0.2 + i / 3) % 1, r = 120 + ph * 500, a = 80 * Math.pow(1 - ph, 1.6) / 255;
    c.beginPath(); c.arc(DW / 2, 322, r, 0, 7); c.strokeStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},${a})`; c.lineWidth = 2; c.stroke();
  }
  c.beginPath(); c.arc(DW / 2, 322, 175 + bass * 70, 0, 7); c.strokeStyle = `rgba(255,255,255,${(60 + bass * 60) / 255})`; c.lineWidth = 3; c.stroke();

  // dust
  DUST.forEach(d => {
    const x = ((d.x + 12 * Math.sin(t * 0.6 + d.ph)) % DW + DW) % DW, y = (((d.y - d.sp * t) % DH) + DH) % DH;
    const a = (60 + 70 * (0.5 + 0.5 * Math.sin(t * 1.7 + d.ph))) / 255;
    c.beginPath(); c.arc(x, y, d.sz, 0, 7); c.fillStyle = `rgba(220,230,255,${a})`; c.fill();
  });

  // mirrored spectrum
  const base = 660;
  for (let i = 0; i < 96; i++) {
    const idx = Math.floor(Math.abs(i - 47.5) - 0.5), h = 6 + Math.min(1.1, bars[idx]) * 92, x = 18 + i * 13, col = BAR_COLS[i];
    c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.72)`; c.fillRect(x, base - h, 8, h);
    c.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},0.24)`; c.fillRect(x, base + 4, 8, h * 0.32);
  }

  // progress
  c.fillStyle = 'rgba(255,255,255,0.09)'; c.fillRect(0, DH - 4, DW, 4);
  c.fillStyle = `rgba(${acc[0]},${acc[1]},${acc[2]},0.8)`; c.fillRect(0, DH - 4, DW * clamp(t / Math.max(1, dur), 0, 1), 4);
  drawUI(c, t, k, 'rgba(255,255,255,0.55)', 'rgba(255,255,255,0.9)', true);

  // lyrics
  const L = lines[k];
  if (!L || t < L.ts) return;
  const lay = getLayout('motion', k), S = cv.width / DW;
  const ex = k === lines.length - 1 ? 0 : clamp((t - (L.te - 0.22)) / 0.22, 0, 1);
  const stag = Math.min(0.07, 0.55 / Math.max(1, L.words.length)), bump = bass * 4;
  const ac2 = ACCENTS[k % 3];
  c.font = font(800, lay.size); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const st = lay.words.map(wd => {
    const p = clamp((t - (L.ts + wd.i * stag)) / 0.38, 0, 1), e = 1 - Math.pow(1 - p, 3);
    return { a: e * (1 - ex), dy: (1 - e) * 30 - ex * 18 - bump };
  });
  // reflection
  const axis = lay.bottom + 2, RH = 150;
  c.save(); c.translate(0, 2 * axis); c.scale(1, -1);
  const rg = c.createLinearGradient(0, axis, 0, axis - RH);
  rg.addColorStop(0, 'rgba(255,255,255,0.3)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = rg;
  lay.words.forEach((wd, i) => { if (st[i].a > 0.003) { c.globalAlpha = st[i].a; c.fillText(wd.text, wd.x, wd.base + st[i].dy); } });
  c.restore();
  // main text
  lay.words.forEach((wd, i) => {
    const s = st[i]; if (s.a <= 0.003) return;
    const x = wd.x, y = wd.base + s.dy;
    c.globalAlpha = s.a;
    c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 0; c.shadowOffsetX = 2 * S; c.shadowOffsetY = 4 * S;
    c.fillStyle = '#fff'; c.fillText(wd.text, x, y);
    c.shadowColor = `rgba(${ac2[0]},${ac2[1]},${ac2[2]},0.95)`; c.shadowBlur = 28 * S; c.shadowOffsetX = 0; c.shadowOffsetY = 0;
    c.fillText(wd.text, x, y);
    c.shadowBlur = 0; c.shadowColor = 'transparent';
  });
  c.globalAlpha = 1;
}

/* ------------------------------------------------------------------ style: minimal */
function drawGrain(c) {
  if (!grainPat) grainPat = c.createPattern(grain, 'repeat');
  c.save(); c.globalAlpha = 0.045; c.translate(Math.floor(Math.random() * 256), Math.floor(Math.random() * 256));
  c.fillStyle = grainPat; c.fillRect(-256, -256, DW + 512, DH + 512); c.restore();
}

function drawMinimal(c, t, k) {
  const inv = k % 5 === 4;
  const bg = inv ? '#f4f4f4' : '#050505', fg = inv ? '#0a0a0a' : '#f4f4f4';
  c.fillStyle = bg; c.fillRect(0, 0, DW, DH);
  const L = lines[k];
  if (L && t >= L.ts) {
    const lay = getLayout('minimal', k), bounce = bassEnv * 6;
    const ex = k === lines.length - 1 ? 0 : clamp((t - (L.te - 0.12)) / 0.12, 0, 1);
    c.fillStyle = fg; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    lay.words.forEach((wd, i) => {
      const p = clamp((t - lay.times[i]) / 0.34, 0, 1); if (p <= 0) return;
      const e = 1 - Math.pow(1 - p, 4), h = wd.size * 1.06, off = (1 - e) * h - ex * h;
      if (Math.abs(off) >= h) return;
      c.save(); c.beginPath(); c.rect(wd.x - 6, wd.base - wd.size * 0.8 - bounce, wd.w + 12, h); c.clip();
      c.font = font(900, wd.size); c.fillText(wd.text, wd.x, wd.base + off - bounce); c.restore();
    });
  }
  const dim = inv ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
  drawUI(c, t, k, dim, fg, false);
  c.fillStyle = inv ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.16)'; c.fillRect(60, 712, DW - 120, 2);
  c.fillStyle = inv ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.82)'; c.fillRect(60, 712, (DW - 120) * clamp(t / Math.max(1, dur), 0, 1), 2);
  drawGrain(c);
}

/* ------------------------------------------------------------------ style: word cut */
function drawCut(c, t, k) {
  const inv = k % 2 === 1;
  const bg = inv ? '#f4f4f4' : '#050505', fg = inv ? '#0a0a0a' : '#f4f4f4';
  c.fillStyle = bg; c.fillRect(0, 0, DW, DH);
  const L = lines[k];
  if (L) {
    const lay = getLayout('cut', k), started = t >= lay.times[0];
    let j = 0; while (j + 1 < lay.times.length && lay.times[j + 1] <= t) j++;
    if (started) {
      const wd = lay.words[j], age = t - lay.times[j], s = 1 + 0.16 * Math.pow(Math.max(0, 1 - age / 0.14), 2);
      c.save(); c.translate(DW / 2, DH / 2 - 12 - bassEnv * 8); c.scale(s, s);
      c.fillStyle = fg; c.font = font(900, wd.size); c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      c.fillText(wd.text, 0, 0.36 * wd.size); c.restore();
    }
    c.font = font(700, lay.csz); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    lay.ctx.forEach((w, wi) => {
      const a = !started ? 0.28 : wi === j ? 1 : wi < j ? 0.58 : 0.28;
      c.globalAlpha = a; c.fillStyle = fg; c.fillText(w.text, w.x, 650);
    });
    c.globalAlpha = 1;
  }
  const dim = inv ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)';
  drawUI(c, t, k, dim, fg, false);
  c.fillStyle = inv ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.16)'; c.fillRect(60, 712, DW - 120, 2);
  c.fillStyle = inv ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.82)'; c.fillRect(60, 712, (DW - 120) * clamp(t / Math.max(1, dur), 0, 1), 2);
  drawGrain(c);
}

function drawPlaceholder(c) {
  c.fillStyle = '#0b0b10'; c.fillRect(0, 0, DW, DH);
  c.fillStyle = 'rgba(255,255,255,0.55)'; c.font = font(700, 30); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('음악과 가사 파일을 올리면 여기에 미리보기가 나와요', DW / 2, DH / 2);
}

function render(t) {
  const S = cv.width / DW;
  cx.setTransform(S, 0, 0, S, 0, 0); cx.globalAlpha = 1; cx.shadowBlur = 0; cx.globalCompositeOperation = 'source-over';
  if (!ready()) { drawPlaceholder(cx); return; }
  const k = Math.max(0, lineIndexAt(lines, t));
  if (style === 'motion') drawMotion(cx, t, k); else if (style === 'minimal') drawMinimal(cx, t, k); else drawCut(cx, t, k);
  const fade = Math.min(1, t / 0.3, (dur - t) / 1.0);
  if (fade < 1) { cx.fillStyle = `rgba(0,0,0,${1 - Math.max(0, fade)})`; cx.fillRect(0, 0, DW, DH); }
}

/* ------------------------------------------------------------------ main loop */
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  updateAudio(dt);
  const t = ready() ? curTime() : 0;
  try { render(t); } catch (e) { /* keep loop alive */ }
  if (ready()) {
    $('timeLbl').textContent = fmt(t) + ' / ' + fmt(dur);
    if (!seeking) $('seek').value = Math.round(t / Math.max(0.001, dur) * 1000);
    if (exporting) {
      const pct = clamp(t / dur, 0, 1);
      $('progBar').style.width = (pct * 100).toFixed(1) + '%';
      $('progTxt').textContent = exportPausedHidden ? '화면이 가려져서 잠시 멈췄어요. 이 화면으로 돌아오면 이어서 녹화해요.' : `녹화 중… ${Math.round(pct * 100)}% · 남은 시간 ${fmt(dur - t)}`;
    }
  }
}
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('800 40px Inter'), document.fonts.load('900 40px Inter'), document.fonts.load('700 24px Inter'),
    document.fonts.load('700 24px "Noto Sans KR"'), document.fonts.load('900 40px "Noto Sans KR"')]).then(() => layoutCache.clear()).catch(() => {});
}

/* ------------------------------------------------------------------ export (real-time recording) */
function pickMime() {
  if (typeof MediaRecorder === 'undefined') return null;
  const cands = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  return cands.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
}

const canRecord = !!(cv.captureStream && typeof MediaRecorder !== 'undefined');
if (!canRecord) { $('exportBtn').disabled = true; $('exportNote').textContent = '이 브라우저는 영상 녹화를 지원하지 않아요. 최신 Chrome, Edge, Safari에서 열어 주세요.'; }

async function startExport() {
  if (!ready() || exporting || !canRecord) return;
  ensureAC();
  if (!recDest) { setStatus('이 브라우저는 소리 녹음을 지원하지 않아요.', 'err'); return; }
  try { await ac.resume(); } catch (e) {}
  pause(); applyRes(); layoutCache.clear();
  resultBlob = null; $('result').hidden = true;
  recMime = pickMime();
  const vs = cv.captureStream(30);
  const stream = new MediaStream([...vs.getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const opts = { videoBitsPerSecond: res === 1080 ? 10e6 : 6e6, audioBitsPerSecond: 192000 };
  if (recMime) opts.mimeType = recMime;
  try { rec = new MediaRecorder(stream, opts); } catch (e) { setStatus('녹화를 시작할 수 없어요: ' + (e.message || e), 'err'); return; }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  exporting = true; exportPausedHidden = false;
  speakerGain.gain.value = 0;
  $('exportBtn').hidden = true; $('prog').hidden = false; $('progBar').style.width = '0%';
  ['playBtn', 'seek', 'resSel', 'syncRange'].forEach(id => { $(id).disabled = true; });
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  startOffset = 0;
  rec.start(1000);
  play(0);
}

function finishExport() {
  if (!exporting || !rec) return;
  try { if (rec.state !== 'inactive') rec.stop(); } catch (e) {}
}

function onRecStop() {
  if (!exporting) return;
  const type = (recMime || (chunks[0] && chunks[0].type) || 'video/webm').split(';')[0];
  resultBlob = new Blob(chunks, { type });
  resultExt = type.includes('mp4') ? 'mp4' : 'webm';
  endExportUI();
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = URL.createObjectURL(resultBlob);
  const v = $('resultVideo'); v.src = resultUrl;
  $('result').hidden = false;
  $('resultNote').textContent = resultExt === 'webm'
    ? '웹엠(webm) 형식으로 만들어졌어요. 대부분의 기기에서 재생되지만, 편집 앱에서는 mp4로 변환이 필요할 수 있어요.'
    : 'mp4 형식으로 만들어졌어요.';
  setStatus('영상이 완성됐어요. 아래에서 확인하고 저장하세요.', 'good');
  $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function endExportUI() {
  exporting = false; exportPausedHidden = false;
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  $('prog').hidden = true; $('exportBtn').hidden = false;
  ['playBtn', 'seek', 'resSel', 'syncRange'].forEach(id => { $(id).disabled = false; });
  speakerGain.gain.value = 1;
  startOffset = 0; playing = false; updatePlayBtn(); setPoster(); refresh();
}

$('exportBtn').addEventListener('click', startExport);
$('cancelBtn').addEventListener('click', () => {
  if (!exporting) return;
  exporting = false;
  if (rec) { rec.onstop = null; try { if (rec.state !== 'inactive') rec.stop(); } catch (e) {} }
  stopSrc(); playing = false;
  endExportUI(); setStatus('녹화를 취소했어요.');
});

document.addEventListener('visibilitychange', () => {
  if (!exporting || !rec) return;
  if (document.hidden && playing) {
    pause(); exportPausedHidden = true;
    try { if (rec.state === 'recording') rec.pause(); } catch (e) {}
  } else if (!document.hidden && exportPausedHidden) {
    exportPausedHidden = false;
    try { if (rec.state === 'paused') rec.resume(); } catch (e) {}
    ac.resume().then(() => play(startOffset));
  }
});

/* ------------------------------------------------------------------ save */
const safeName = s => (s || 'lyric-video').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'lyric-video';
const STYLE_NAME = { motion: 'motion', minimal: 'minimal', cut: 'wordcut' };
$('saveBtn').addEventListener('click', async () => {
  if (!resultBlob) return;
  const name = safeName($('titleIn').value) + '_' + STYLE_NAME[style] + '.' + resultExt;
  try {
    if (dlNS) { await dlNS.save({ filename: name, data: resultBlob }); setStatus('저장 요청을 보냈어요.', 'good'); }
    else {
      const a = document.createElement('a'); a.href = resultUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setStatus('저장되지 않으면 위 영상을 길게 눌러 저장해 주세요.');
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
    setStatus('저장하지 못했어요. 위 영상을 길게 눌러 저장해 보세요.', 'err');
  }
});
$('againBtn').addEventListener('click', () => { $('result').hidden = true; window.scrollTo({ top: 0, behavior: 'smooth' }); });

refresh();
})();
</script>
</body>
</html>
